# 服务器端口
server.port=8080

# 数据库连接配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/access_control?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis 配置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging.level.com.access.control=debug

# 头像持久化目录（写入磁盘，重启不丢失）
# - 相对路径：相对「启动后端时的工作目录」；在 backend 目录启动请用 ../data/uploads
# - 绝对路径示例（Windows）: app.upload-dir=D:/毕设/基于小程序的门禁预约管理平台设计与实现/data/uploads
app.upload-dir=../data/uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
